<!DOCTYPE html>
<html lang="en">


  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists and Tables</title>

  </head>
  <body>

  <ul>
    <li>python</li>
    <li>C++</li>
    <li>Dart</li>
  </ul>

  <ol>
    <li>Choose a topic
    <li>
       Study the topic
       <ul>
         <li>Read the material</li>
         <li>Take notes</li>
       </ul>
    </li>Practice and review</li>
  </ol>


  <table>
      <caption>Weekly Study Timetable</caption>
      <thead>
        <tr>
          <th scope="col">Day</th>
          <th scope="col">Topic</th> 
          <th scope="col">Hours</th>   
        </tr>
      </head>

      <tbody>
         <tr>
           <td>Sundy</td>
           <td>python</td>
           <td>2</td>
         </tr>

         <tr> 
           <td>Tuesday</td>
           <td>Git</td>
           <td>2</td> 
         </tr>

         <tr>
           <td>Wednesday</td>
           <td>SQL</td> 
           <td>2</td>
         </tr>
      </tbody>
  </table>   
   

  </body>
</html>
